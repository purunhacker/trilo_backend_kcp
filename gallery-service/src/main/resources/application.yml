server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: gallery-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trilo}
    username: ${DB_USER:trilo}
    password: ${DB_PASSWORD:trilo}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 블루-그린 롤아웃 중 구/신 컨테이너가 공존하므로 유휴 커넥션을 최소화
      # (전 서비스 풀 합계가 postgres max_connections를 넘지 않도록 제한)
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gallery
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas:
      - gallery
    locations: classpath:db/migration
    table: flyway_schema_history

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: gallery-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: app.trilo.common.event
        spring.json.type.mapping: tripDeleted:app.trilo.common.event.TripDeletedEvent,tripUpdated:app.trilo.common.event.TripUpdatedEvent,mediaUploaded:app.trilo.common.event.MediaUploadedEvent,userDeleted:app.trilo.common.event.UserDeletedEvent

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URL:http://localhost:8081/auth/.well-known/jwks.json}

management:
  metrics:
    distribution:
      # 요청 응답시간 p95/p99 (Micrometer 클라이언트 사이드 percentile).
      # 히스토그램 버킷(le=...)은 series 가 급증하므로 사용하지 않는다.
      percentiles:
        http.server.requests: 0.95,0.99
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    app.trilo: DEBUG
